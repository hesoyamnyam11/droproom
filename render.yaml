services:
  - type: web
    name: droproom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: APP_ENV
        value: production
      - key: ROOM_TTL_SECONDS
        value: "600"